# Requires Dynamo 1.5 with native beta DGD overrides and args append support.
# GPU discovery and the installation's profiler credentials must be available.
apiVersion: airunway.ai/v1alpha1
kind: ModelDeployment
metadata:
  name: qwen-auto
  namespace: default
spec:
  model:
    id: Qwen/Qwen3-0.6B
    source: huggingface
  engine:
    type: vllm
  provider:
    name: dynamo
    overrides:
      deploymentMode: intent
      intent:
        hardware:
          totalGpus: 1
        searchStrategy: rapid
        overrides:
          profilingJob:
            activeDeadlineSeconds: 1800
          dgd:
            apiVersion: nvidia.com/v1beta1
            kind: DynamoGraphDeployment
            spec:
              components:
                - name: VllmDecodeWorker
                  podTemplate:
                    spec:
                      containers:
                        - name: main
                          # Keep generated launch arguments and add the Qwen3 parsers.
                          $patch:
                            args: append
                          args:
                            - --dyn-tool-call-parser
                            - hermes
                            - --dyn-reasoning-parser
                            - qwen3
        workload:
          isl: 1024
          osl: 256
          requestRate: 1
        sla:
          ttft: 1000
          itl: 50
  gateway:
    enabled: true
